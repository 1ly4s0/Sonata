apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.gms.google-services"

import com.android.build.OutputFile

def reactNativeDir = file("../../node_modules/react-native")
def reactNativeVersion = "0.73.6"

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

// Load signing credentials from keystore.properties (not committed to VCS)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tecnobros.sonata"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.tecnobros.sonata"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['MYAPP_UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['MYAPP_UPLOAD_STORE_PASSWORD']
                keyAlias keystoreProperties['MYAPP_UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['MYAPP_UPLOAD_KEY_PASSWORD']
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libjsc.so"
    }
}

dependencies {
    // React Native
    implementation("com.facebook.react:react-android:+")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android:+")
    } else {
        implementation jscFlavor
    }

    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Firebase Analytics
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-analytics"
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// ── JS Bundle for Release Builds ───────────────────────────────────────────
// @react-native/gradle-plugin is excluded due to Gradle 8.9 incompatibility.
// This task manually bundles JS before assembling any release variant.
afterEvaluate {
    def assetDir = file("src/main/assets")
    def bundleOut = new File(assetDir, "index.android.bundle")

    tasks.register("bundleReleaseJs", Exec) {
        group = "react"
        description = "Bundle React Native JS for release builds"
        workingDir(rootProject.file(".."))
        doFirst { assetDir.mkdirs() }
        commandLine(
            "cmd", "/c",
            "node node_modules/react-native/cli.js bundle " +
            "--platform android --dev false --reset-cache " +
            "--entry-file index.js " +
            "--bundle-output \"${bundleOut.absolutePath.replace('\\', '/')}\" " +
            "--assets-dest android/app/src/main/res"
        )
    }

    // Wire bundle task before assets are merged for all release variants
    tasks.configureEach { task ->
        if (task.name == "mergeReleaseAssets" || task.name == "packageRelease") {
            task.dependsOn("bundleReleaseJs")
        }
        // Gradle 8.9 strict mode: explicit ordering for vector icon fonts
        if (task.name.contains('LintVital') || task.name.contains('LintModel')) {
            def copyFontsTask = tasks.findByName('copyReactNativeVectorIconFonts')
            if (copyFontsTask) {
                task.mustRunAfter(copyFontsTask)
            }
        }
    }
}
