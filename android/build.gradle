// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            // RN 0.71+ renamed the artifact from react-native to react-android on Maven Central
            substitute module("com.facebook.react:react-native") using module("com.facebook.react:react-android:0.73.6")
        }
        resolutionStrategy {
            force "com.facebook.react:react-android:0.73.6"
            force "com.facebook.react:hermes-android:0.73.6"
            // Force androidx.core 1.15.0 to stay within compileSdk 34 / AGP 8.3.2 requirements
            force "androidx.core:core:1.15.0"
            force "androidx.core:core-ktx:1.15.0"
        }
    }

    repositories {
        maven {
            // RN 0.71+ no longer ships prebuilt AARs in npm; artifacts are on Maven Central.
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral()
        google()
        maven { url 'https://www.jitpack.io' }
    }

    // Fix JVM target mismatch. Java 21 JDK → align both Java and Kotlin to JVM 17.
    afterEvaluate {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = '17'
        }
        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }

        // Fix JVM target mismatch. Align Java and Kotlin targets across all subprojects.
        if (plugins.hasPlugin('com.android.library')) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                buildFeatures {
                    buildConfig = true
                }
            }
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = '17'
            }
            if (!android.namespace) {
                def manifestFile = android.sourceSets.main.manifest.srcFile
                if (manifestFile.exists()) {
                    def xml = new XmlParser().parse(manifestFile)
                    def pkg = xml.@package
                    if (pkg) {
                        android.namespace = pkg
                    }
                }
            }
        }
    }
}
